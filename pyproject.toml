[project]
name = "bpe-tokenizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "regex>=2026.9.29",
    "tiktoken>=0.14.0",
    "torch>=2.14.1",
]

[project.scripts]
bpe-tokenizer = "bpe_tokenizer:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
]
